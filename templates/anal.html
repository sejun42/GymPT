<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ name }}님의 운동 분석 결과</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #333;
            overflow: hidden; /* 스크롤바 숨기기 */
        }
        .container {
            display: grid;
            grid-template-columns: 12fr 6fr 6fr; /* 각 열의 너비를 설정합니다 */
            grid-template-rows: 2fr 1fr 6fr 6fr; /* 각 행의 높이를 설정합니다 */
            gap: 10px;
            width: 100%; /* 화면의 전체 너비를 차지합니다 */
            height: 100vh; /* 화면의 전체 높이를 차지합니다 */
            background-color: #444;
            padding: 20px;
            box-sizing: border-box;
        }
        .container > div {
            border: 2px solid #fff;
            padding: 10px;
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .item1 {
            grid-column: 1 / 2;
            grid-row: 1 / 2;
        }
        .item2 {
            grid-column: 2 / 4;
            grid-row: 1 / 3;
        }
        .item3 {
            grid-column: 1 / 2;
            grid-row: 2 / 4;
        }
        .item4 {
            grid-column: 2 / 4;
            grid-row: 3 / 4;
        }
        .item5 {
            grid-column: 1 / 3;
            grid-row: 4 / 5;
        }
        .item6 {
            grid-column: 3 / 4;
            grid-row: 4 / 5;
        }
        .graph {
            width: 100%;
            height: 100%;
        }

        .sidebar {
            width: 80px;
            background-color: #222;
            position: fixed;
            right: 0;
            top: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            padding: 20px 0;
        }
        .icon {
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 0%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item1">{{ name }}님의 결과 리포트<br>2025.06.01</div>
        <div class="item2">                
            exercise_time=exercise_time<br>
            Time: 20:39 min:sec<br>
            Reps: 15<br>
            Volume: 10000 kg</div>
        <div class="item3">운동 영상</div>
        <div class="item4">
            <div class="graph" id="graph"></div>
        </div>
        <div class="item5">분석 그래프</div>
        <div class="item6">회원님~ 주어진 데이터를 확인해보니...</div>
    </div>
    <script>
        var graphs = {{ graphJSON | safe }};
        Plotly.newPlot('graph', graphs);
    </script>
    <div class="sidebar">
        <div>
            <a href="{{ url_for('rank') }}" style="text-decoration: none; color: white;">
                <div class="icon">
                    <img src="{{ url_for('static', filename='images/rank.png') }}" alt="순위 아이콘" style="width: 100%; height: auto;">
                </div>
            </a>
        </div>
        <div>
            <a href="{{ url_for('anal') }}" style="text-decoration: none; color: white;">
                <div class="icon">
                    <img src="{{ url_for('static', filename='images/anal.png') }}" alt="분석 아이콘" style="width: 100%; height: auto;">
                </div>
            </a>
        </div>
        <div>
            <a href="{{ url_for('select') }}" style="text-decoration: none; color: white;">
                <div class="icon">
                    <img src="{{ url_for('static', filename='images/exer_s.png') }}" alt="운동 아이콘" style="width: 100%; height: auto;">
                </div>
            </a>
        </div>
    </div>
</body>
</html>
